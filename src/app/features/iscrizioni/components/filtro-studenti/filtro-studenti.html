<form [formGroup]="filtroForm" (ngSubmit)="onSubmit()" class="card card-body mb-4 shadow-sm rounded-4">
    <div class="row g-2 justify-content-center align-items-end w-100 m-0">

        <div class="col-md-4">
            <label class="form-label text-center"><strong>Nome</strong></label>
            <input formControlName="nome" class="form-control input-custom rounded-5 shadow-sm">
        </div>

        <div class="col-md-4">
            <label class="form-label text-center"><strong>Cognome</strong></label>
            <input formControlName="cognome" class="form-control input-custom rounded-5 shadow-sm">
        </div>

        <div class="col-md-auto text-center align-self-md-end">
            <button type="submit" class="btn btn-custom btn-primary mt-3 px-4 ms-2">Filtra</button>
            <button type="button" class="btn btn-custom btn-outline-secondary mt-3 ms-2" (click)="onReset()">Reset</button>
        </div>

    </div>
</form>
