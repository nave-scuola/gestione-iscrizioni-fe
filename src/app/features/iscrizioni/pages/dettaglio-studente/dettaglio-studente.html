<div class="container mt-4">
    

    @if (studente()) {
        <div class="card card-custom p-4 rounded-4">
            <h2>Dettaglio Studente</h2>
            <hr>
            <h3>{{studente()?.nome}} {{studente()?.cognome}} ({{studente()?.codiceStudente}})</h3>
            <p>Email: {{studente()?.email}}</p>
            <p>Codice Fiscale: {{studente()?.cf}}</p>
            <p>Città: {{studente()?.citta}}</p>

        </div>
    } @else {
        <div class="alert alert-danger">
            Studente con ID {{id()}} non trovato nel sistema.
        </div>
    }

    <button type="button" class="btn btn-custom btn-primary mt-4 btn-sm" routerLink="/studenti">Torna alla lista</button>

</div>
