<div class="container mt-4">
    
    <h2 class="mb-5 mt-4 fw-bold text-secondary fs-4">Lista studenti</h2>

    <input type="text" class="form-control rounded-4 mb-4 shadow-sm" placeholder="Cerca..."
           [value]="filtroTesto()" (input)="filtroTesto.set($any($event.target).value)" 
    >

    @if (studentiFiltrati().length === 0) {
        <div class="alert alert-info">Nessun elemento trovato</div>
    } @else {
        <div class="row g-3">
            @for (item of studentiFiltrati(); track item.idStudente) {
                <div class="col-md-4">
                    <app-card
                        [titolo]="item.nome + ' ' + item.cognome"
                        [descrizione]="item.codiceStudente"
                        (selezionato)="onCardClick(item)"
                    >  
                    </app-card>
                </div>
            }
        </div>
    }

</div>
